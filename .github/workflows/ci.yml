name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests + the PostgreSQL-backed concurrency tests (hot seat, overlapping multi-seat requests, per-user limit,
  # idempotent retries, cancel races) against a real database.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start PostgreSQL with a throw-away random password
        run: |
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "TEST_DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          docker run -d --name pg -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=seats_test \
            -p 127.0.0.1:5432:5432 postgres:16-alpine
          for i in $(seq 1 40); do
            docker exec pg pg_isready -U postgres -d seats_test && exit 0
            sleep 1
          done
          echo "PostgreSQL did not start" >&2
          exit 1

      - name: mvn verify
        working-directory: seatManagement
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/seats_test
          TEST_DB_USER: postgres
        run: ./mvnw -B -ntp verify

  # The real artefact: build the Docker image, start it with PostgreSQL through compose, and run the burst test
  # against it exactly as a reviewer would.
  burst:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create .env with random secrets and start the stack
        run: |
          make env
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Burst test (2,000 requests)
        run: ./burst.sh http://localhost:8080 --quick

      - name: Burst test (everyone fights over one seat)
        run: ./burst.sh http://localhost:8080 --one-seat --requests 5000 --skip-probes

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=300 app

      - name: Stop
        if: always()
        run: docker compose down -v
