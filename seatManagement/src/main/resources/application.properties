spring.application.name=seatManagement
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# ---------------------------------------------------------------------------------------------------------------
# Configuration contract: everything environment-specific comes from ENV VARS, read in AppSettings.
#   required : ADMIN_TOKEN (>=16 chars), TOKEN_SECRET (>=32 chars), DATABASE_URL (or DB_HOST/DB_NAME/DB_USER/DB_PASSWORD)
#   optional : see AppSettings and README.md
# There are intentionally no default secrets here: the app refuses to start without them (fail closed).
# ---------------------------------------------------------------------------------------------------------------

# Platforms (Render, Railway, Fly, Cloud Run, ...) inject PORT.
server.port=${PORT:8080}

# On SIGTERM stop accepting new work, let in-flight requests finish (and /readyz flips to 503 immediately).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Embedded Tomcat sized for a stampede: many cheap queued connections, a bounded set of workers. The real
# concurrency limit is the DB pool (DB_POOL_SIZE); workers beyond it just wait in line instead of failing.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:400}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:25}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:30000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:4096}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:60s}
# Opt-in (needs a Java 21+ runtime; the Docker image has one): one virtual thread per request.
spring.threads.virtual.enabled=${VIRTUAL_THREADS:false}

# Structured JSON logs on stdout. MDC fields (request_id, user_id, status, duration_ms, outcome ...) appear as
# top-level keys, so every line of a request can be found by its request_id.
logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.flywaydb=INFO
# One structured access-log line per request (logger "access"). On a very small instance set ACCESS_LOG_LEVEL=WARN
# to keep only 5xx and warnings; metrics and the request id on every response are unaffected.
logging.level.access=${ACCESS_LOG_LEVEL:INFO}

# Schema migrations run before the port opens (so a cold start is only "up" once the schema is ready) and take a
# database advisory lock, so several instances starting at once do not race. Retry while the DB is still waking.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:8}
spring.flyway.connect-retries-interval=${FLYWAY_CONNECT_RETRIES_INTERVAL:15s}

server.error.whitelabel.enabled=false
