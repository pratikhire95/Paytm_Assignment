# Local / single-host deployment: the service plus its PostgreSQL.
#
#   make up            # creates .env with random secrets (first time), builds, starts, waits until /readyz is 200
#   make burst         # the burst test against http://localhost:8080
#
# Every secret comes from .env (git-ignored; see .env.example). There are no default credentials: compose refuses to
# start while ADMIN_TOKEN, TOKEN_SECRET or POSTGRES_PASSWORD is missing.
name: seat-reservation

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seats}
      POSTGRES_DB: ${POSTGRES_DB:-seats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run "make env" (or copy .env.example to .env and fill it in)}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: lets `make test-db` run the integration tests from the host; not reachable from the network.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ./seatManagement
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-seats}
      DB_USER: ${POSTGRES_USER:-seats}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is not set - run "make env" (or copy .env.example to .env and fill it in)}
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is not set - run "make env" (or copy .env.example to .env and fill it in)}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      PUBLIC_LOGS_ENABLED: ${PUBLIC_LOGS_ENABLED:-true}
      ALLOW_TOKEN_MINT: ${ALLOW_TOKEN_MINT:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hardening: immutable root filesystem (Tomcat only needs /tmp), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
