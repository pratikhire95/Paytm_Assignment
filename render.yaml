# Render Blueprint: New > Blueprint > pick this repository. It creates the PostgreSQL database and the web service,
# wires them together and generates the two secrets - nothing sensitive is stored in this file.
#
# Free-tier facts that matter for grading (check Render's current pricing page before relying on them):
#   * a free web service has 512 MB RAM / 0.1 CPU and is put to sleep after 15 minutes without traffic; the first
#     request after that is a JVM cold start (see .github/workflows/keepwarm.yml and README.md "Cold starts");
#   * a free PostgreSQL database expires after 30 days - move to a paid plan for anything that must outlive that.
# For the ~20,000-request burst a larger instance is much faster: change both `plan:` lines below.
databases:
  - name: seats-db
    databaseName: seats
    user: seats
    plan: free

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    dockerfilePath: ./seatManagement/Dockerfile
    dockerContext: ./seatManagement
    # Liveness. (/readyz also checks the database; it is what monitors and the burst script use.)
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString
      # Generated once by Render, visible only to you in the dashboard (Environment tab). Give the ADMIN_TOKEN to the
      # reviewers through the submission, never through the repository.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TOKEN_SECRET
        generateValue: true
      - key: DB_POOL_SIZE
        value: "20"
      # Keep the JVM inside the 512 MB limit of the free plan.
      - key: JAVA_OPTS
        value: "-XX:+UseSerialGC -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
